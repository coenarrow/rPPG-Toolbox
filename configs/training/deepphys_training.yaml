# DeepPhys paper recipe. This file IS how rPPG-Toolbox trains DeepPhys
# (configs/train_configs/PURE_PURE_UBFC-rPPG_DEEPPHYS_BASIC.yaml and its
# DeepPhysTrainer): AdamW at 9e-3 with no weight decay, OneCycleLR over the
# run, batch 4, 30 epochs, float32. Pair it with
# configs/interfaces/deepphys_interface.yaml.
EPOCHS: 30
BATCH_SIZE: 4                # train and test alike
OPTIMIZER: AdamW             # upstream: optim.AdamW(lr, weight_decay=0)
LR: 9e-3
WEIGHT_DECAY: 0.0            # upstream decays nothing
SCHEDULER: OneCycle          # upstream: OneCycleLR(max_lr=LR) over every step
PRECISION: float32           # upstream trains in full precision
DEVICE: gpu                  # gpu | cpu; gpu = CUDA or Apple MPS, refused if neither exists
NUM_WORKERS: 4               # DataLoader workers (a machine key, not the paper's)
# MODEL_FILE_NAME: deepphys  # optional; default <MODEL>_<DATASET>.<participant|all>-..._<YYYYMMDDHHMM>
