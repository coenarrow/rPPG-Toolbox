# PhysNet paper recipe. This file IS how rPPG-Toolbox trains PhysNet
# (configs/train_configs/PURE_PURE_UBFC-rPPG_PHYSNET_BASIC.yaml and its
# PhysnetTrainer): Adam at 9e-3 with no weight decay, OneCycleLR over the
# run, batch 4, 30 epochs, float32. Pair it with
# configs/interfaces/physnet_interface.yaml.
#
# One trainer-side difference: the readout is exempt from weight decay here
# (see src/trainer.py); moot upstream, which decays nothing at all.
EPOCHS: 30
BATCH_SIZE: 4                # train and test alike
OPTIMIZER: Adam              # upstream: optim.Adam(lr), no weight decay
LR: 9e-3
WEIGHT_DECAY: 0.0
SCHEDULER: OneCycle          # upstream: OneCycleLR(max_lr=LR) over every step
PRECISION: float32           # upstream trains in full precision
DEVICE: gpu                  # gpu | cpu; gpu = CUDA or Apple MPS, refused if neither exists
NUM_WORKERS: 4               # DataLoader workers (a machine key, not the paper's)
# MODEL_FILE_NAME: physnet    # optional; default <MODEL>_<DATASET>.<participant|all>-..._<YYYYMMDDHHMM>
