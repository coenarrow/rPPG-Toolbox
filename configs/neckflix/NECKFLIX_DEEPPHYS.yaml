# DeepPhys on the Neckflix zarr cache, predicting ABP + CVP + ECG together.
#
# The migration pilot for docs/plans/2026-08-31-model-migration-contract.md, so
# this file is also the template every later migration copies. Schema: the
# DATA / INTERFACE / MODEL split
# (docs/plans/2026-08-31-interface-config-redesign.md).
#
# What differs from the published DeepPhys: the first conv of each branch takes
# len(CHANNELS) inputs instead of 3, and the final dense layer emits
# len(TRACES) outputs instead of 1. Nothing between them changed.
#
# LOSO: the participant(s) named with --test_participants are held out of
# training and are the whole test set. Recordings that lack one of the traces
# still train the others (ALLOW_MISSING + label_mask).
#
#   uv run python main.py \
#       --config_file configs/neckflix/NECKFLIX_DEEPPHYS.yaml \
#       --test_participants P015
MODE: train_and_test
DEVICE: cuda:0
LOG:
  PATH: "runs/neckflix_deepphys"

DATA:
  DATASET: Neckflix
  CACHED_PATH: "C:/Users/20759193/neckflix_cache/rgb128"
  FILTERS:
    posture: ['0', '45', '90']
  ALLOW_MISSING: True
  MIN_CHANNELS: 1
  MIN_LABELS: 1
  SPLITS:
    TRAIN:
      STRIDE_SECONDS: 3.0       # 50% overlap between training windows
    TEST: {}

INTERFACE:
  FS: 30.0
  WINDOW_SECONDS: 6.0           # 180 frames at FS 30 (upstream CHUNK_LENGTH)
  CHANNELS: ['R', 'G', 'B']
  TRACES: ['ABP', 'CVP', 'ECG']
  RESIZE:
    H: 72                       # upstream DeepPhys frame size; DeepPhys sizes
    W: 72                       # its dense layer from it, so 0 is not allowed
  DATA_TYPE: ['DiffNormalized', 'Standardized']   # DeepPhys splits these into
                                                  # its motion/appearance branches
  # LABEL_NORM omitted: class defaults (ABP/CVP raw mmHg, ECG zscore).

MODEL:
  NAME: DeepPhys
  HEAD_STYLE: widened           # style A; 'per_signal' only on evidence of interference

TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 30
  LR: 9e-3                      # the upstream DeepPhys rate
  USE_AMP: True
  AMP_DTYPE: 'bfloat16'
  MODEL_FILE_NAME: neckflix_deepphys_rgb
  # Per signal: an absolute-class signal is predicted in mmHg, so it is scored
  # on level (CCC + L1 on the window mean and the soft systolic/diastolic
  # peaks); a shape-class one only on waveform. The L1 weights are where the
  # per-signal scale factor lives. Omit a signal, or the whole block, to take
  # its class default.
  LOSS:
    ABP: {TYPE: absolute, WEIGHTS: {CCC: 1.0, MEAN: 0.05, MAX: 0.05, MIN: 0.05}}
    CVP: {TYPE: absolute, WEIGHTS: {CCC: 1.0, MEAN: 0.2, MAX: 0.2, MIN: 0.2}}
    ECG: {TYPE: shape,    WEIGHTS: {NEGPEARSON: 1.0}}

TEST:
  BATCH_SIZE: 4
  USE_LAST_EPOCH: True          # set False and pass --valid_participants for model selection
