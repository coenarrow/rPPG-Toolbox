# PhysMamba on the Neckflix zarr cache, predicting ABP + CVP + ECG together.
#
# Schema: the DATA / INTERFACE / MODEL split
# (docs/plans/2026-08-31-interface-config-redesign.md). DATA says which stores
# participate; INTERFACE is the model's demand on the data pipeline and is
# serialized into every checkpoint; MODEL is the architecture.
#
# LOSO: the participant(s) named with --test_participants are held out of
# training and are the whole test set. Recordings that lack one of the traces
# still train the others (ALLOW_MISSING + label_mask).
#
#   uv run python main.py \
#       --config_file configs/neckflix/NECKFLIX_PHYSMAMBA.yaml \
#       --test_participants P015
MODE: train_and_test
DEVICE: cuda:0
LOG_PATH: "runs/neckflix_physmamba"

DATA:
  DATASET: Neckflix
  CACHED_PATH: "C:/Users/20759193/neckflix_cache/rgb128"
  FILTERS:
    posture: ['0', '45', '90']
  ALLOW_MISSING: True           # recordings carry different trace subsets
  MIN_CHANNELS: 1
  MIN_LABELS: 1
  SPLITS:                       # only what genuinely differs per split
    TRAIN:
      STRIDE_SECONDS: 2.133333  # 50% overlap between training windows
    TEST: {}                    # defaults: no overlap, deterministic windows

INTERFACE:
  FS: 30.0                      # model-facing rate; stores are resampled to it
  WINDOW_SECONDS: 4.266667      # 128 frames at FS 30 (64/15 s, PhysMamba's T_orig)
  CHANNELS: ['R', 'G', 'B']
  TRACES: ['ABP', 'CVP', 'ECG']
  RESIZE: 128                   # square shorthand for {H: 128, W: 128}
  DATA_TYPE: ['DiffNormalized']
  # LABEL_NORM omitted: ABP/CVP take their class default (raw, mmHg) and ECG
  # takes zscore. Stating them would restate signals.py.

MODEL:
  NAME: PhysMamba
  DROP_RATE: 0.2

TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 30
  LR: 1e-3
  USE_AMP: True
  AMP_DTYPE: 'bfloat16'
  MODEL_FILE_NAME: neckflix_physmamba_rgb
  # Per signal; omit to take the class default. The L1 weights are where the
  # per-signal scale factor lives -- raw ABP error is O(10 mmHg) and CVP
  # O(1 mmHg), so unweighted they would not reach the optimiser comparably.
  LOSS:
    ABP: {TYPE: absolute, WEIGHTS: {CCC: 1.0, MEAN: 0.05, MAX: 0.05, MIN: 0.05}}
    CVP: {TYPE: absolute, WEIGHTS: {CCC: 1.0, MEAN: 0.2, MAX: 0.2, MIN: 0.2}}
    ECG: {TYPE: shape,    WEIGHTS: {NEGPEARSON: 1.0}}

TEST:
  BATCH_SIZE: 4
  USE_LAST_EPOCH: True          # set False and pass --valid_participants for model selection
