# CPU/laptop smoke variant of NECKFLIX_DEEPPHYS.yaml: short windows, 36x36
# frames, one epoch. Use it to check the pipeline runs end-to-end before
# submitting the real config.
#
#   uv run python main.py --limit_windows 8 --test_participants P015 \
#       --config_file configs/neckflix/NECKFLIX_DEEPPHYS_SMOKE.yaml
BASE: [NECKFLIX_DEEPPHYS.yaml]
DEVICE: cpu
LOG_PATH: "runs/neckflix_deepphys_smoke"

DATA:
  SPLITS:
    TRAIN:
      STRIDE_SECONDS: 1.066667

INTERFACE:
  WINDOW_SECONDS: 2.133333      # 64 frames at FS 30 (smoke; upstream is 6.0)
  RESIZE: 36                    # smoke; upstream DeepPhys is 72

TRAIN:
  BATCH_SIZE: 2
  EPOCHS: 1
  USE_AMP: False
  MODEL_FILE_NAME: neckflix_deepphys_smoke

TEST:
  BATCH_SIZE: 2
