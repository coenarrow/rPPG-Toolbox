# PhysFormer on the Neckflix zarr cache, predicting ABP + CVP + ECG together.
#
# Schema: the DATA / INTERFACE / MODEL split
# (docs/plans/2026-08-31-interface-config-redesign.md).
#
# LOSO: the participant(s) named with --test_participants are held out of
# training and are the whole test set. Recordings that lack one of the traces
# still train the others (ALLOW_MISSING + label_mask).
#
#   uv run python main.py \
#       --config_file configs/neckflix/NECKFLIX_PHYSFORMER.yaml \
#       --test_participants P015
MODE: train_and_test
DEVICE: cuda:0
LOG_PATH: "runs/neckflix_physformer"

DATA:
  DATASET: Neckflix
  CACHED_PATH: "C:/Users/20759193/neckflix_cache/rgb128"
  FILTERS:
    posture: ['0', '45', '90']
  ALLOW_MISSING: True
  MIN_CHANNELS: 1
  MIN_LABELS: 1
  SPLITS:
    TRAIN:
      STRIDE_SECONDS: 2.666667  # 50% overlap between training windows
    TEST: {}

INTERFACE:
  FS: 30.0                      # model-facing rate; stores are resampled to it
  WINDOW_SECONDS: 5.333333      # 160 frames @ 30 fps (16/3 s) = PhysFormer's
                                # published T_orig (legacy CHUNK_LENGTH: 160)
  CHANNELS: ['R', 'G', 'B']
  TRACES: ['ABP', 'CVP', 'ECG']
  RESIZE: 128                   # the published tokenization: 8x stem pooling
                                # then 4x4 patches leaves a 4x4 token grid
  DATA_TYPE: ['DiffNormalized']
  # LABEL_NORM omitted: class defaults (ABP/CVP raw mmHg, ECG zscore).

MODEL:
  NAME: PhysFormer
  DROP_RATE: 0.1
  PHYSFORMER:
    PATCH_SIZE: 4               # tube size; the head's 2x2 temporal upsampling
                                # fixes the temporal patch at 4
    DIM: 96
    FF_DIM: 144
    NUM_HEADS: 4
    NUM_LAYERS: 12              # split three ways across the three stages
    THETA: 0.7                  # central-difference weight in the CDC convs

TRAIN:
  BATCH_SIZE: 4                 # measured: 4.05 GiB peak and 2.1 s/step at
                                # 128x128 x 160 frames, bf16, on a 16 GB card
  EPOCHS: 30
  LR: 1e-4                      # the published PhysFormer LR; OneCycle peaks here
  USE_AMP: True
  AMP_DTYPE: 'bfloat16'
  MODEL_FILE_NAME: neckflix_physformer_rgb
  # ABP/CVP take the absolute-class default and are not restated here. ECG is
  # stated only to add the spectral term: PhysFormer's published recipe trains
  # against a frequency-domain target alongside the waveform correlation, and
  # in this pipeline that belongs in the registry as a component weight, not
  # as a parallel criterion in the trainer (see the migration retro).
  LOSS:
    ECG: {TYPE: shape, WEIGHTS: {NEGPEARSON: 1.0, SPECTRAL: 0.5}}

TEST:
  BATCH_SIZE: 4
  USE_LAST_EPOCH: True          # set False and pass --valid_participants for model selection
