# Traditional (unsupervised) rPPG over the Neckflix zarr cache.
#
# The cache carries no PPG; ABP, CVP and ECG each carry the cardiac rhythm, so
# every window is scored separately against whichever of them that recording
# actually has (label_mask decides). Run with:
#   uv run python main.py --config_file configs/neckflix/NECKFLIX_UNSUPERVISED.yaml
MODE: unsupervised_method
DEVICE: cpu
LOG_PATH: "runs/neckflix_unsupervised"

DATA:
  DATASET: Neckflix
  CACHED_PATH: "C:/Users/20759193/neckflix_cache/rgb128"
  FILTERS:
    posture: ['0', '45', '90']
  ALLOW_MISSING: True           # recordings carry different trace subsets
  MIN_CHANNELS: 1
  MIN_LABELS: 1
  # SPLITS omitted: the unsupervised mode uses the TEST split policy, whose
  # defaults (no overlap, deterministic windows) are what evaluation wants.

INTERFACE:
  FS: 30.0
  WINDOW_SECONDS: 10.0          # 300 frames at FS 30
  CHANNELS: ['R', 'G', 'B']     # the methods consume raw RGB
  TRACES: ['ABP', 'CVP', 'ECG']
  RESIZE: 128                   # square shorthand for {H: 128, W: 128}
  DATA_TYPE: ['Raw']            # the methods want raw pixels

UNSUPERVISED_METHODS: ["ICA", "POS", "CHROM", "GREEN", "LGI", "PBV", "OMIT"]

TEST:
  BATCH_SIZE: 4
  EVALUATION_METHOD: "FFT"      # "FFT" or "peak detection"
  # EVALUATION_WINDOW_SECONDS omitted: 0 = score each window whole
