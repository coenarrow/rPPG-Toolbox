# FactorizePhys paper interface. This file IS the rPPG-Toolbox configuration
# of FactorizePhys (72x72 frames, 160-frame chunks at 30 fps, Raw input — the
# network differences the clip itself — one PPG trace, negative Pearson
# loss), read off configs/train_configs/PURE_iBVP_FactorizePhys_FSAM_Res.yaml
# at the pre-overhaul tag, the only FactorizePhys recipe there that trains on
# PURE. Run it to check the migration against the paper. Nothing
# Neckflix-specific belongs here: the standard interface is where every model
# meets the pressure traces.
#
# Every key is required — there are no defaults. See docs/adding_a_model.md.
FS: 30.0                       # frame rate the model sees; faster stores are
                               # decimated to it
UPSAMPLING: refuse             # slower stores: refuse | interpolate
WINDOW_SECONDS: 5.333333       # 160 frames (160 / 30), the upstream
                               # CHUNK_LENGTH
WINDOW_STRIDE: 1.0             # seconds the test set steps between windows
CHANNELS: [R, G, B]            # ordered camera channels, subset of R,G,B,I,D
TRACES: [PPG]                  # the paper predicts BVP and nothing else
RESIZE: {H: 72, W: 72}         # upstream FactorizePhys frame size
INPUT_PREPROCESSING: [Raw]     # upstream DATA_TYPE ['Raw']: FactorizePhys
                               # differences the frames in the network
LABEL_PREPROCESSING:           # upstream LABEL_TYPE Standardized; zscore is
  PPG: zscore                  # the nearest of raw | zscore
LOSS:                          # upstream trains FactorizePhys with negative
  PPG: {NEGPEARSON: 1.0}       # Pearson, on a z-scored prediction and label
                               # (moot here: the criterion is invariant to
                               # both scale and offset)
