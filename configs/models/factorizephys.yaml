# FactorizePhys (Joshi et al., 2024). Selected with --model factorizephys.
#
# A model file carries the architecture's name plus the switches an experiment
# may flip. Layer sizes are NOT here: the architecture is defined once, in
# neural_methods/model/FactorizePhys/FactorizePhys.py, at its published
# values. Widths come from the interface — the stem takes len(CHANNELS)
# inputs, and there is one complete copy of the network per entry of TRACES.
# Any window length works: nothing in the network strides or pools in time.
NAME: FactorizePhys

# Which INPUT_PREPROCESSING block the stem reads, by name. Must be listed in
# the interface's INPUT_PREPROCESSING. The paper feeds Raw frames and takes
# the temporal difference inside the network.
INPUT: Raw

# The factorized self-attention module — NMF over the voxel embeddings, with
# the residual connection: the paper's FSAM_Res path. False is the paper's
# own ablation, the same network with the attention branch left out.
FSAM: true
