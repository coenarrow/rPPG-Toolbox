# PhysNet (Yu et al., 2019). Selected with --model physnet.
#
# A model file carries the architecture's name plus the switches an experiment
# may flip. Layer sizes are NOT here: the architecture is defined once, in
# neural_methods/model/PhysNet.py, at its published values. Widths come from
# the interface — the stem takes len(CHANNELS) inputs, and there is one
# complete copy of the network per entry of TRACES. Any window length works:
# the trunk's two temporal halvings pool the stem's output to the nearest
# multiple of 4 first, and the prediction is interpolated back afterwards.
NAME: PhysNet

# Which INPUT_PREPROCESSING block the stem reads, by name. Must be listed in
# the interface's INPUT_PREPROCESSING. The paper trains on DiffNormalized.
INPUT: DiffNormalized
