# EfficientPhys (Liu et al., WACV 2023). Selected with --model efficientphys.
#
# A model file carries the architecture's name plus the switches an experiment
# may flip. Layer sizes are NOT here: the architecture is defined once, in
# neural_methods/model/EfficientPhys.py, at its published values. Widths come
# from the interface — the first conv takes len(CHANNELS) inputs, and there is
# one complete copy of the network per entry of TRACES.
NAME: EfficientPhys

# Which INPUT_PREPROCESSING block feeds the network, by name; it must be
# listed in the interface's INPUT_PREPROCESSING. EfficientPhys is
# single-branch and takes the frame difference itself, so it reads the
# standardised frames rather than a differenced block.
INPUT: Standardized

# The segment length the temporal shift (TSM) shifts within. Upstream
# MODEL.EFFICIENTPHYS.FRAME_DEPTH; the PURE recipe trains at 10, not the
# class default of 20. A window not a multiple of this shifts its trailing
# frames as their own shorter segment (see TSM in TS_CAN.py).
FRAME_DEPTH: 10
