[project]
name = "remote-physiology"
version = "0.1.0"
description = "Multi-signal remote physiology toolkit (BVP, ABP, CVP, RR, ...) — fork of rPPG-Toolbox"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # ---- The coupled GPU cluster: pinned, moves together (targets chosen
    # from docs/plans/platform-reports/; see the roadmap, Phase 3.5). ----
    # Builds from its PyPI sdist on Windows as-is; only mamba-ssm needs patching.
    "causal-conv1d>=1.7.0 ; sys_platform != 'darwin'",
    # Pinned exact on every platform: 2.3.2+ hard-requires tilelang /
    # quack-kernels / apache-tvm-ffi (Linux-only, for Mamba3 backends we do
    # not use), which breaks Windows and bloats the HPC env.
    "mamba-ssm==2.3.1 ; sys_platform == 'linux'",
    "mamba-ssm-macos>=1.0.2 ; sys_platform == 'darwin'",
    # Windows builds the patched vendor/mamba-ssm tree instead (see
    # tool.uv.sources below and tools/vendor_mamba_windows.py). Pinned rather
    # than >=, because the vendored tree is one specific upstream release.
    "mamba-ssm==2.3.1 ; sys_platform == 'win32'",
    # cu126 is the newest wheel family the fleet can run: the V100 partition
    # is sm_70 (dropped from cu128+/cu130) and the cluster driver (575.57)
    # caps CUDA at 12.9. torch 2.12 is the newest torch with a triton-windows
    # release; see docs/plans/platform-reports/.
    "torch==2.12.1",
    # Nothing here imports torchvision (timm requires it), but tool.uv.sources
    # only applies to declared dependencies, so it is declared to force the
    # cu126 index — the PyPI wheel is a different CUDA variant. No pin needed:
    # each torchvision requires its exact torch partner, so torch's pin
    # transitively pins this.
    "torchvision>=0.27",
    # `triton` publishes no Windows wheel and no sdist, so mamba-ssm's dependency
    # on it makes the whole environment uninstallable here. triton-windows is the
    # same 3.8 series (what torch 2.12 pairs with) rebuilt for win_amd64, and it
    # imports as `triton`. See override-dependencies below.
    "triton-windows>=3.8,<3.9 ; sys_platform == 'win32'",
    # ---- Everything else floats: floors are the tested baseline, uv.lock is
    # the reproducibility record. Audited 2026-08-31 — each entry below has a
    # live import; transitive-only packages (transformers, huggingface-hub,
    # fsspec, ...) are not repeated here. ----
    "einops>=0.8.2",
    "h5py>=3.16", # PhysHydraTrainer only; leaves in Phase 6
    "matplotlib>=3.11",
    "numpy>=2.5",
    "pandas>=3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9", # bigsmall_multitask_metrics only; leaves in Phase 6
    "scipy>=1.18",
    "timm>=1.0.29",
    "tqdm>=4.70",
    "zarr>=3.3",
    "pillow>=12.3.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
# Installed by `uv sync` by default; skip on the HPC with `uv sync --no-dev`.
dev = [
    "black>=25.1",
    "ipykernel>=7.3",
    "ipympl>=0.9.8",
    "ipywidgets>=8.1.9",
    "isort>=6",
    "pytest>=8.4",
]

[tool.uv]
link-mode = "copy"
cache-dir = ".uv_cache"

# Confine `triton` to the one platform it ships wheels for. Both torch and
# mamba-ssm require it unconditionally; on Windows it has neither a wheel nor an
# sdist, so without this uv resolves fine and then refuses to install anything.
# The Windows replacement, triton-windows, is a normal dependency above.
# The override REPLACES torch's own triton pin, so the pairing must be stated
# here and moved together with torch (torch 2.12 <-> triton 3.8).
override-dependencies = ["triton==3.8.0 ; sys_platform == 'linux'"]

# mamba-ssm and causal-conv1d compile CUDA against whatever torch they import at
# build time. An isolated build env resolves `torch` from PyPI, which on Windows
# is the CPU-only wheel -- `torch.version.cuda` is None and c10_cuda.lib is not
# there to link against -- so they build against this project's torch instead.
# The cost is that torch must already be installed when they are built; into a
# fresh environment, run
#     uv sync --no-install-package mamba-ssm --no-install-package causal-conv1d
# first. `setup.sh` has always done the same thing by hand.
no-build-isolation-package = ["mamba-ssm", "causal-conv1d"]

# The Neckflix preprocessor is a git submodule at dataset/cachers/neckflix, NOT a
# dependency of this project, and deliberately has no tool.uv.sources entry.
# A path source there makes uv fail in any clone that skipped
# --recurse-submodules, because such a clone leaves dataset/cachers/neckflix as an
# EMPTY DIRECTORY:
#   empty dir   -> `uv lock` / `uv sync` exit 1: "does not appear to be a
#                  Python project, as neither `pyproject.toml` nor `setup.py`
#                  are present in the directory"
#   absent dir  -> `uv lock` exit 2: "Distribution not found at: file:///..."
# This holds even for a NON-DEFAULT dependency group: a `preprocess` group
# under [dependency-groups] still breaks a plain `uv sync --no-dev`, i.e. it
# would break training, not just cache-building. Cache builds therefore run
# against Neckflix's OWN lock, in its own venv:
#   uv run --project dataset/cachers/neckflix neckflix-preprocess --input-dir ... --output-dir ...
# which also keeps av / opencv-python-headless / hdf5plugin and Neckflix's
# `zarr>=3.3,<4` cap out of the HPC training environment. Do not add a
# [tool.uv.workspace] table either: it would pull the submodule into this
# resolution and undo all of the above.
[tool.uv.sources]
# Windows only: the published sdist does not compile with MSVC. vendor/mamba-ssm
# is the same 2.3.1 release with three mechanical fixes, regenerated (and
# verifiable) by tools/vendor_mamba_windows.py. Linux and macOS are untouched.
mamba-ssm = [
  { path = "vendor/mamba-ssm", marker = "sys_platform == 'win32'" },
]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" },
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


# external/ is the Neckflix submodule: a separate project with its own repo,
# lock and style. Every tool that walks this tree has to be told to leave it
# alone, or a `black .` here lands as a diff in someone else's repository.
[tool.pytest.ini_options]
testpaths = ["tests"]
# Overriding norecursedirs REPLACES pytest's defaults, so they are restated.
norecursedirs = ["external", "*.egg", ".*", "_darcs", "build", "CVS", "dist",
                 "node_modules", "venv", "{arch}"]

[tool.black]
# A regex, and the leading ^/ anchors it to the project root.
extend-exclude = "^/external/"

[tool.isort]
# extend_skip_glob, not skip_glob, so isort's own defaults survive.
extend_skip_glob = ["external/*"]
