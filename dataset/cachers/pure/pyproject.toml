[project]
name = "pure-cacher"
version = "0.1.0"
description = "PURE dataset cacher: timestamped PNG sequences + oximeter JSON into zarr stores that satisfy docs/cache-contract.md"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "tqdm>=4.67.1",
    "zarr>=3.3,<4",
]

[project.scripts]
pure-preprocess = "pure_cacher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pure_cacher"]

[tool.uv]
link-mode = "copy"
